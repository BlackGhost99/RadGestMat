name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
permissions:
  contents: write
concurrency:
  group: android-publish-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-35" || sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure persistent signing when available
        env:
          SIGNING_STORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_STORE" ]; then
            printf '%s' "$SIGNING_STORE" | base64 --decode > "$RUNNER_TEMP/radgestmat.jks"
            # Normalize a Windows PFX (PKCS12) or a JKS with a single signing key.
            # Java reads the actual key alias, since Windows may assign its own.
            cat > "$RUNNER_TEMP/SigningInfo.java" <<'JAVA'
            import java.io.File;
            import java.security.KeyStore;
            import java.util.ArrayList;
            public class SigningInfo {
                public static void main(String[] args) throws Exception {
                    char[] password = System.getenv("SIGNING_PASSWORD").toCharArray();
                    KeyStore store = KeyStore.getInstance(new File(args[0]), password);
                    var entries = new ArrayList<String>();
                    var aliases = store.aliases();
                    while (aliases.hasMoreElements()) {
                        String alias = aliases.nextElement();
                        if (store.isKeyEntry(alias)) entries.add(alias);
                    }
                    String configured = System.getenv("SIGNING_ALIAS");
                    String alias = configured;
                    if (configured == null || configured.isBlank() || configured.equalsIgnoreCase("AUTO")) {
                        if (entries.size() != 1) throw new IllegalStateException("Expected exactly one private key");
                        alias = entries.get(0);
                    }
                    if (!store.isKeyEntry(alias) || alias.contains("\n") || alias.contains("\r"))
                        throw new IllegalStateException("Invalid signing key alias");
                    System.out.println("RADGESTMAT_STORE_TYPE=" + store.getType());
                    System.out.println("RADGESTMAT_RESOLVED_ALIAS=" + alias);
                }
            }
            JAVA
            java "$RUNNER_TEMP/SigningInfo.java" "$RUNNER_TEMP/radgestmat.jks" >> "$GITHUB_ENV"
            echo "RADGESTMAT_KEYSTORE=$RUNNER_TEMP/radgestmat.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android
        env:
          RADGESTMAT_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RADGESTMAT_KEY_ALIAS: ${{ env.RADGESTMAT_RESOLVED_ALIAS }}
          RADGESTMAT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish APK signing fingerprint
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee apk-signing.txt
          cat apk-signing.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: RadGestMat-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Lint
        working-directory: android
        run: gradle --no-daemon :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Publish signed update
        if: success() && env.RADGESTMAT_KEYSTORE != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$((1000 + GITHUB_RUN_NUMBER))
          tag="android-v$code"
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/RadGestMat.apk
          export VERSION_CODE="$code" UPDATE_TAG="$tag"
          python - <<'PY'
          import json, hashlib, os
          from pathlib import Path
          apk = Path("release/RadGestMat.apk")
          data = {"version_code": int(os.environ["VERSION_CODE"]),
                  "version_name": "1." + os.environ["GITHUB_RUN_NUMBER"],
                  "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
                  "size": apk.stat().st_size}
          Path("release/update.json").write_text(json.dumps(data))
          PY
          gh release create "$tag" release/RadGestMat.apk release/update.json --target "$GITHUB_SHA" --title "RadGestMat 1.$GITHUB_RUN_NUMBER" --notes "Version Android signée - $GITHUB_SHA" --latest
