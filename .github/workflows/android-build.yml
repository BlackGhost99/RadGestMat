name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
permissions:
  contents: write
concurrency:
  group: android-publish-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-35" || sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure persistent signing when available
        env:
          SIGNING_STORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$SIGNING_STORE" ]; then
            test -n "$SIGNING_PASSWORD" && test -n "$SIGNING_KEY_PASSWORD"
            umask 077
            printf '%s' "$SIGNING_STORE" | base64 --decode > "$RUNNER_TEMP/radgestmat.keystore"
            java android/tools/SigningInfo.java "$RUNNER_TEMP/radgestmat.keystore" >> "$GITHUB_ENV"
            echo "RADGESTMAT_KEYSTORE=$RUNNER_TEMP/radgestmat.keystore" >> "$GITHUB_ENV"
            echo "APK_VARIANT=release" >> "$GITHUB_ENV"
          elif [ -n "$SIGNING_PASSWORD$SIGNING_KEY_PASSWORD$SIGNING_ALIAS" ]; then
            echo "::error::Incomplete Android signing configuration"
            exit 1
          else
            echo "APK_VARIANT=debug" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android
        env:
          RADGESTMAT_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RADGESTMAT_KEY_ALIAS: ${{ env.RADGESTMAT_RESOLVED_ALIAS }}
          RADGESTMAT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$APK_VARIANT" = release ]; then
            gradle --no-daemon :app:assembleRelease
          else
            gradle --no-daemon :app:assembleDebug
          fi
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp "android/app/build/outputs/apk/$APK_VARIANT/app-$APK_VARIANT.apk" dist/RadGestMat.apk

      - name: Publish APK signing fingerprint
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/RadGestMat.apk | tee apk-signing.txt
          cat apk-signing.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: RadGestMat-Android
          path: dist/RadGestMat.apk
          if-no-files-found: error
          retention-days: 30
      - name: Lint
        working-directory: android
        run: |
          if [ "$APK_VARIANT" = release ]; then
            gradle --no-daemon :app:lintRelease
          else
            gradle --no-daemon :app:lintDebug
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint
          path: android/app/build/reports/lint-results-*
          if-no-files-found: ignore
      - name: Publish signed update
        if: success() && env.RADGESTMAT_KEYSTORE != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$((1000 + GITHUB_RUN_NUMBER))
          tag="android-v$code"
          mkdir -p release
          cp dist/RadGestMat.apk release/RadGestMat.apk
          export VERSION_CODE="$code" UPDATE_TAG="$tag"
          python - <<'PY'
          import json, hashlib, os
          from pathlib import Path
          apk = Path("release/RadGestMat.apk")
          data = {"version_code": int(os.environ["VERSION_CODE"]),
                  "version_name": "1." + os.environ["GITHUB_RUN_NUMBER"],
                  "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
                  "size": apk.stat().st_size}
          Path("release/update.json").write_text(json.dumps(data))
          PY
          gh release create "$tag" release/RadGestMat.apk release/update.json --target "$GITHUB_SHA" --title "RadGestMat 1.$GITHUB_RUN_NUMBER" --notes "Version Android signée - $GITHUB_SHA" --latest
