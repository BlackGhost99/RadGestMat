version: '3.8'

services:
  # Redis pour cache et sessions
  redis:
    image: redis:7-alpine
    container_name: radgestmat_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # PostgreSQL database service
  postgres:
    image: postgres:15-alpine
    container_name: radgestmat_postgres
    environment:
      POSTGRES_USER: radgestmat
      POSTGRES_PASSWORD: change_me_secure
      POSTGRES_DB: radgestmat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Django application avec Gunicorn
  web:
    build: .
    container_name: radgestmat_web
    command: >
      sh -c "if [ ! -f /app/db_data/db.sqlite3 ] && [ -f /app/db.sqlite3 ]; then cp /app/db.sqlite3 /app/db_data/db.sqlite3; fi && 
             python manage.py migrate && 
             python manage.py collectstatic --noinput && 
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile - radgestmat.wsgi:application"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - db_volume:/app/db_data
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=radgestmat.settings.production
      - REDIS_URL=redis://redis:6379/1
      - DISABLE_SIGNALS=0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: radgestmat_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://web:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
  static_volume:
  media_volume:
  db_volume:
  postgres_data:

