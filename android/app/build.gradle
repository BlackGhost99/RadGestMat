plugins { id 'com.android.application' }
android {
    namespace 'com.radgestmat.app'
    compileSdk 35
    if (System.getenv('RADGESTMAT_KEYSTORE')) {
        signingConfigs {
            persistent {
                storeFile file(System.getenv('RADGESTMAT_KEYSTORE'))
                storePassword System.getenv('RADGESTMAT_STORE_PASSWORD')
                keyAlias System.getenv('RADGESTMAT_KEY_ALIAS')
                keyPassword System.getenv('RADGESTMAT_KEY_PASSWORD')
            }
        }
        buildTypes { debug { signingConfig signingConfigs.persistent } }
    }
    defaultConfig {
        applicationId 'com.radgestmat.app'
        minSdk 26
        targetSdk 35
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ? 1000 + System.getenv('GITHUB_RUN_NUMBER').toInteger() : 1)
        versionName (System.getenv('GITHUB_RUN_NUMBER') ? '1.' + System.getenv('GITHUB_RUN_NUMBER') : '0.1')
    }
}

dependencies { implementation 'androidx.work:work-runtime:2.10.0'; implementation 'androidx.core:core:1.15.0' }
