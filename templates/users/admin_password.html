{% extends 'base.html' %}
{% block title %}Nouveau mot de passe{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:650px"><div class="card card-body">
<h1 class="h4">Nouveau mot de passe — {{ target.username }}</h1>
<p class="text-body-secondary">Préférez l'envoi d'un lien si l'utilisateur peut accéder à sa messagerie.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}
<button class="btn btn-primary" type="submit">Enregistrer le mot de passe</button>
<a class="btn btn-outline-secondary" href="{% url 'users:user_detail' target.pk %}">Annuler</a>
</form></div></div>
{% endblock %}
